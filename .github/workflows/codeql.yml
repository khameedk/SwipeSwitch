# GitHub CodeQL: scans the Swift code for security problems. Results appear under Security › Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: ./build.sh

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
