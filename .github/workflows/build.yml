# Builds the app from the code in this repo and checks it contains no networking code.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the development variant (demo and test hooks)
        run: ./build.sh --dev

      - name: Build SwipeSwitch.app
        run: ./build.sh

      - name: Check for networking code (source and binary)
        run: ./scripts/check-no-network.sh build/SwipeSwitch.app/Contents/MacOS/SwipeSwitch
